name: Verificación de Ritmo

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar dependencias de pruebas
        run: python -m pip install -r backend/requirements.txt
      - name: Probar el cálculo de fechas
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Compilar y arrancar la arquitectura
        run: |
          ./scripts/setup-local.sh
          docker compose up --build -d --wait
      - name: Probar HTTPS, Keycloak, API y procesamiento de eventos
        run: python scripts/integration.py
      - name: Mostrar estado de los servicios si falla la prueba
        if: failure()
        run: docker compose ps -a
      - name: Retirar el entorno efímero
        if: always()
        run: test ! -f .env || docker compose down --volumes
