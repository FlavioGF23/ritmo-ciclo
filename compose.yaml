name: ritmo-ciclo

x-backend: &backend
  build: ./backend
  image: ritmo-backend:local
  environment:
    DATABASE_URL: "postgresql://ritmo_app:${APP_DB_PASSWORD:?Ejecuta scripts/setup-local.sh}@postgres:5432/ritmo_app"
    AMQP_URL: "amqp://ritmo:${RABBIT_PASSWORD:?Ejecuta scripts/setup-local.sh}@rabbitmq:5672/%2f"
    OIDC_ISSUER: "${APP_ORIGIN:?Ejecuta scripts/setup-local.sh}/auth/realms/ritmo"
    KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth
    KEYCLOAK_CLEANUP_SECRET: "${KEYCLOAK_CLEANUP_SECRET:?Ejecuta scripts/setup-local.sh}"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:?Ejecuta scripts/setup-local.sh}"
      APP_DB_PASSWORD: "${APP_DB_PASSWORD}"
      IDENTITY_DB_PASSWORD: "${IDENTITY_DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/01-ritmo.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$${APP_DB_PASSWORD} psql -h 127.0.0.1 -U ritmo_app -d ritmo_app -Atqc 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ritmo
      RABBITMQ_DEFAULT_PASS: "${RABBIT_PASSWORD}"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    command: ["start", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ritmo-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/ritmo_identity
      KC_DB_USERNAME: ritmo_identity
      KC_DB_PASSWORD: "${IDENTITY_DB_PASSWORD}"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: "${APP_ORIGIN}/auth"
      KC_PROXY_HEADERS: xforwarded
      KC_LOG_LEVEL: WARN
      APP_ORIGIN: "${APP_ORIGIN}"
      KEYCLOAK_CLEANUP_SECRET: "${KEYCLOAK_CLEANUP_SECRET}"
    volumes:
      - ./infra/keycloak/ritmo-realm.json:/opt/keycloak/data/import/ritmo-realm.json:ro
    restart: unless-stopped

  identity-setup:
    <<: *backend
    entrypoint: ["python", "-B", "/srv/ritmo/identity_init.py"]
    command: []
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
    volumes:
      - ./infra/keycloak/identity_init.py:/srv/ritmo/identity_init.py:ro
    depends_on:
      keycloak:
        condition: service_started

  api:
    <<: *backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped

  gateway:
    image: kong:3.9.1
    depends_on:
      api:
        condition: service_healthy
      identity-setup:
        condition: service_completed_successfully
      frontend:
        condition: service_started
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/ritmo.yml
      KONG_ADMIN_LISTEN: "off"
      KONG_PROXY_LISTEN: "0.0.0.0:8443 ssl"
      KONG_SSL_CERT: /etc/kong/tls/cert.pem
      KONG_SSL_CERT_KEY: /etc/kong/tls/key.pem
      KONG_SSL_PROTOCOLS: TLSv1.2 TLSv1.3
      KONG_PROXY_ACCESS_LOG: "off"
      KONG_LOG_LEVEL: warn
      KONG_NGINX_HTTP_CLIENT_MAX_BODY_SIZE: 16k
    volumes:
      - ./infra/kong/ritmo.yml:/etc/kong/ritmo.yml:ro
      - ./.local/tls:/etc/kong/tls:ro
    ports:
      - "127.0.0.1:${HTTPS_PORT:-8443}:8443"
    restart: unless-stopped

volumes:
  postgres_data:
  rabbit_data:
